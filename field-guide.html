   deeper:'<p>Quality levers: <b>diversify inputs deliberately</b> (vary domain, length, difficulty, style in the generation prompt — otherwise you get 500 clones of your seeds), <b>generate hard negatives</b> (edge cases, ambiguous requests, invalid-input handling), and <b>close the loop</b> (whatever your eval says the model gets wrong, generate more training data of exactly that).</p><p>Watch for <b>model collapse</b> in miniature: training only on synthetic data narrows style and diversity. Anchor with real examples from your actual work whenever possible.</p>',
   rel:['data','distillation','iterate']},
  {id:'task-evals', term:'Task-specific evals',
   plain:'Your specialist’s exam — written before training begins.',
   gist:'Before training anything, build the test: 20–50 real tasks with automatic grading. For code experts, grading is gloriously objective: does it parse? compile? validate against the schema? pass the tests? Run every candidate model and every fine-tune version against it. The eval, not the loss curve, defines "better".',
   why:'This converts fine-tuning from alchemy to engineering. It also gives you the before/after number that tells you whether the whole micro-expert project paid off.',
   deeper:'<p>Design tips: include <b>tiers</b> (easy/medium/hard — a score of 100% means your eval is too easy to steer with), <b>traps</b> (cases where the model should refuse or ask for clarification), and <b>regression cases</b> (every real failure you ever find gets immortalized as a test).</p><p>Keep it runnable in one command and fast enough to run on every experiment. A simple script beats a fancy framework you won’t maintain — upgrade tooling only when the simple version hurts.</p>',
   rel:['evals','splits','iterate']},
  {id:'recipe', term:'The micro-expert recipe',
   plain:'The end-to-end playbook, using a GraphQL specialist as the running example.',
   gist:'Seven steps: (1) define the task narrowly; (2) build the eval first; (3) baseline existing models with good prompting; (4) build the dataset — real + synthetic, validated; (5) QLoRA-fine-tune a small base; (6) evaluate against the baseline; (7) deploy via Ollama and iterate on failures. Expect to loop steps 4–7 several times.',
   why:'This card is the map for your first real project. Every step links to the concepts that power it.',
   deeper:'<p><b>1. Scope</b>: "given a schema and a natural-language request, write a correct, idiomatic GraphQL operation." Narrow beats broad — resist adding resolver code until v2.</p><p><b>2. Eval</b>: 30 request+schema → expected-operation cases; grade with a GraphQL parser + schema validation + field-level comparison.</p><p><b>3. Baseline</b>: score Qwen-3B/8B-class models with a strong system prompt and few-shot examples. Maybe prompting alone hits 85% and you’re done — that’s a win too.</p><p><b>4. Data</b>: ~50 hand-written gold examples from your real work + a few hundred validated synthetic variations.</p><p><b>5. Train</b>: <code>mlx_lm.lora</code> on your Mac, rank 16, 2–3 epochs, watching validation loss.</p><p><b>6. Judge</b>: eval score vs. baseline; inspect every failure by hand.</p><p><b>7. Ship & loop</b>: fuse adapter → GGUF → <code>ollama create graphql-expert</code> → use it daily; every failure becomes next round’s training data.</p>',
   rel:['task-evals','synthetic','qlora','ollama']},
  {id:'serving', term:'Serving & integration',
   plain:'A model becomes a product when something can call it.',
   gist:'Once your expert lives in Ollama, it exposes a standard local API — wire it into scripts, editor extensions, git hooks, or a CLI. Because adapters are small, one base model can back several experts, swapping the active specialty in seconds.',
   why:'Integration is where daily value appears: your GraphQL expert reviewing every query in pre-commit, or answering inside your editor with zero API cost.',
   deeper:'<p>Patterns that work at personal scale: a <b>shell alias</b> piping into the model for quick asks; an <b>OpenAI-compatible endpoint</b> (Ollama’s) so existing tools plug in by changing a base URL; <b>structured-output mode</b> for anything a program consumes; and <b>keep-alive settings</b> so your daily-driver expert stays warm in memory. Version adapters like code — <code>graphql-expert:v3</code> — so a bad training run is a one-line rollback.</p>',
   rel:['ollama','structured','routing']},
  {id:'routing', term:'Routing & model teams',
   plain:'Many small specialists + a dispatcher beats one mid-size generalist.',
   gist:'With several experts on disk, add a router: a cheap classifier (or tiny LLM, or plain rules) that reads each request and forwards it to the right specialist — GraphQL expert, SQL expert, regex expert. This is mixture-of-experts thinking applied at the system level, and it’s how small local setups punch far above their weight.',
   why:'This is the end-state architecture of your project: a personal team of masters, each swappable and improvable independently — plus a fallback to a generalist for everything else.',
   deeper:'<p>Keep routing boring: keyword rules and file-type detection cover most personal setups; a 1B classifier model covers the rest. Always include a <b>fallback route</b> to a general model for out-of-scope requests, and log every routing decision — misroutes are eval cases for the router.</p><p>The same shape scales up: frontier systems increasingly blend specialized components behind dispatchers. Your laptop version is architecturally honest, just smaller.</p>',
   rel:['agents','serving','microexperts-why']},
  {id:'iterate', term:'The improvement loop',
   plain:'Ship → collect failures → turn them into data → retrain → re-eval. Forever.',
   gist:'A micro-expert is never finished; it compounds. Use it daily, capture every miss, convert misses into new eval cases and training examples, retrain, and compare scores before promoting the new version. Ten such cycles produce an expert nothing off-the-shelf can match, because it’s fitted to your exact work.',
   why:'This loop is the durable moat — the model is replaceable, the base will change, but your eval + dataset improve monotonically and transfer to every future base model.',
   deeper:'<p>Make capture frictionless: a one-keystroke way to flag a bad output (append to a <code>failures.jsonl</code>) determines whether the loop actually runs. Periodically: triage failures into <em>data gaps</em> (add examples), <em>task creep</em> (out of scope — route elsewhere or split off expert #2), and <em>base limits</em> (time to try a newer/bigger base).</p><p>When a new base model family lands, your assets carry over: re-run the same training data and eval against it, compare, migrate if it wins. That’s the quiet superpower of owning the data and the eval rather than the model.</p>',
   rel:['task-evals','preference','data']},
],
  ex:[
  {id:'x-exam', title:'Write the exam first', time:'90 min', level:'Keystone',
   plain:'Your GraphQL expert’s definition of “better,” created before any training happens.',
   steps:'<li>Define the scope in one sentence: “given a schema and a request, write a correct, idiomatic GraphQL operation.”</li><li>Create 25 cases across easy / medium / hard: input schema, request, and the expected operation (or the properties it must have).</li><li>Grade automatically: parse with <code>graphql-core</code> (Python) or <code>graphql</code> (JS), validate against the schema, check the requested fields appear.</li><li>Wrap it in one command that prints a score. This file now outranks your intuition.</li>',
   rel:['task-evals','evals']},

   plain:'Score off-the-shelf models with good prompting — the bar your fine-tune must clear.',
   steps:'<li>Run your exam against 2–3 small models (3B–8B class) under three conditions: plain prompt, your best system prompt, and system prompt + 3 few-shot examples.</li><li>Record every score in a table: model × prompting strategy.</li><li>The best cell is your baseline. If it’s already ≥90%, celebrate and stop — the eval just saved you a month of unnecessary fine-tuning.</li>',
   rel:['choosing','prompting','fewshot']},

   steps:'<li>Hand-write 15 gold examples — your best work; the standard everything generated must match.</li><li>Prompt a strong model to generate variations in batches of 20: new schemas, new phrasings, easy through hard, with explicit diversity instructions.</li><li>Filter ruthlessly: auto-validate every sample with your parser + schema check, dedupe, then eyeball 30 random survivors.</li><li>Target 300–500 validated examples; split off a validation set. Not one unvalidated sample gets through.</li>',
   rel:['synthetic','distillation','data']},
  {id:'x-ship', title:'Capstone: ship graphql-expert:v1', time:'multi-day', level:'Capstone',

/* ---------- state ---------- */
const LS_KEY='mlfg-learned-v1', XS_KEY='mlfg-fieldwork-v1';
let learned=new Set(JSON.parse(localStorage.getItem(LS_KEY)||'[]'));
let done=new Set(JSON.parse(localStorage.getItem(XS_KEY)||'[]'));
let current=0, query='';
const ALL=GUIDE.flatMap((c,ci)=>c.topics.map((t,ti)=>({...t,ci,ti})));
const ALLX=GUIDE.flatMap((c,ci)=>(c.ex||[]).map((x,xi)=>({...x,ci,xi,isEx:true})));
const byId=Object.fromEntries(ALL.map(t=>[t.id,t]));
ALLX.forEach(x=>{byId[x.id]=x});
const total=ALL.length, totalx=ALLX.length;

const nav=document.getElementById('nav');
const main=document.getElementById('main');
const searchEl=document.getElementById('search');

function save(){
  localStorage.setItem(LS_KEY,JSON.stringify([...learned]));
  localStorage.setItem(XS_KEY,JSON.stringify([...done]));
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}

function renderNav(){
  nav.innerHTML=GUIDE.map((c,i)=>{
    const done=c.topics.filter(t=>learned.has(t.id)).length;
    return `<button data-ch="${i}" class="${i===current&&!query?'active':''}">
      <span class="numeral">${c.numeral}</span>
      <span class="t">${c.title}</span>
      <span class="n ${done===c.topics.length?'done':''}">${done}/${c.topics.length}</span>
    </button>`;
  }).join('');
  const n=learned.size;
  document.getElementById('ptext').textContent=`${n} / ${total}`;
  document.getElementById('pbar').style.width=(n/total*100)+'%';
  const nx=done.size;
  document.getElementById('xtext').textContent=`${nx} / ${totalx}`;
  document.getElementById('xbar').style.width=(totalx?nx/totalx*100:0)+'%';
}

function cardHTML(t,num){
  const open=t._open?'open':'', l=learned.has(t.id)?'learned':'';
  const rel=(t.rel||[]).filter(r=>byId[r]);
  return `<article class="card ${open} ${l}" id="card-${t.id}">
    <button class="card-head" data-toggle="${t.id}" aria-expanded="${!!t._open}">
      <span class="spec-id">${num}</span>
      <span class="headmain">
        <div class="term">${t.term}</div>
        <div class="plain">${t.plain}</div>
      </span>
      <span class="chev">▸</span>
    </button>
    <div class="card-body">
      <p class="gist">${t.gist}</p>
      ${t.why?`<div class="why"><b>Why it matters for your goal</b>${t.why}</div>`:''}
      ${t.deeper?`<details class="deeper"><summary>Go deeper</summary><div class="deep-body">${t.deeper}</div></details>`:''}
      <div class="card-foot">
        <button class="learn-btn" data-learn="${t.id}">${learned.has(t.id)?'Collected ✓':'Mark as learned'}</button>
        ${rel.length?`<div class="rel">${rel.map(r=>`<button data-goto="${r}">${byId[r].term}</button>`).join('')}</div>`:''}
      </div>
    </div>
  </article>`;
}

function exHTML(x,num){
  const open=x._open?'open':'', l=done.has(x.id)?'learned':'';
  const rel=(x.rel||[]).filter(r=>byId[r]);
  return `<article class="card ex ${open} ${l}" id="card-${x.id}">
    <button class="card-head" data-toggle="${x.id}" aria-expanded="${!!x._open}">
      <span class="spec-id">${num}</span>
      <span class="headmain">
        <div class="term">${x.title}</div>
        <div class="plain">${x.plain}</div>
      </span>
      <span class="badges"><span class="badge">${x.time}</span><span class="badge">${x.level}</span></span>
      <span class="chev">▸</span>
    </button>
    <div class="card-body">
      <ol class="steps">${x.steps}</ol>
      ${x.hint?`<details class="deeper"><summary>Hint</summary><div class="deep-body">${x.hint}</div></details>`:''}
      <div class="card-foot">
        <button class="learn-btn" data-learn="${x.id}">${done.has(x.id)?'Done ✓':'Mark complete'}</button>
        ${rel.length?`<div class="rel">${rel.map(r=>`<button data-goto="${r}">${byId[r].term||byId[r].title}</button>`).join('')}</div>`:''}
      </div>
    </div>
  </article>`;
}

const exNum=(x)=>GUIDE[x.ci].numeral+'·F'+String(x.xi+1).padStart(2,'0');

function renderMain(){
  if(query){
    const q=query.toLowerCase();
    const hits=ALL.filter(t=>(t.term+' '+t.plain+' '+t.gist+' '+(t.deeper||'')).toLowerCase().includes(q));
    const xhits=ALLX.filter(x=>(x.title+' '+x.plain+' '+x.steps+' '+(x.hint||'')).toLowerCase().includes(q));
    main.innerHTML=`<div class="chapter-head">
      <div class="kicker">Search</div>
      <h2>“${esc(query)}”</h2>
      <p>${hits.length} concept${hits.length===1?'':'s'} and ${xhits.length} exercise${xhits.length===1?'':'s'} found across the guide.</p>
    </div>
    <div class="cards">${hits.map(t=>cardHTML(t,GUIDE[t.ci].numeral+'·'+String(t.ti+1).padStart(2,'0'))).join('')||(xhits.length?'':'<p class="empty">Nothing in the guide matches that — yet.</p>')}</div>
    ${xhits.length?`<div class="fw-head"><div class="fw-kicker">Field work</div></div>
    <div class="cards">${xhits.map(x=>exHTML(x,exNum(x))).join('')}</div>`:''}`;
  }else{
    const c=GUIDE[current];
    const prev=GUIDE[current-1], next=GUIDE[current+1];
    main.innerHTML=`<div class="chapter-head">
      <div class="kicker">Chapter ${c.numeral} · ${c.topics.length} concepts</div>
      <h2>${c.title}</h2>
      <p>${c.desc}</p>
    </div>
    <div class="cards">${c.topics.map((t,i)=>cardHTML(t,c.numeral+'·'+String(i+1).padStart(2,'0'))).join('')}</div>
    ${c.ex&&c.ex.length?`<div class="fw-head">
      <div class="fw-kicker">Field work · ${c.ex.length} exercise${c.ex.length===1?'':'s'}</div>
      <h3>Now get your hands dirty</h3>
      <p>Reading builds a map; doing builds the territory. Each exercise is designed to be finished in one sitting on your own machine.</p>
    </div>
    <div class="cards">${c.ex.map(x0=>{const x=byId[x0.id];return exHTML(x,exNum(x))}).join('')}</div>`:''}
    <div class="pager">
      ${prev?`<button data-nav="${current-1}"><span>← Previous</span>${prev.title}</button>`:'<span></span>'}
      ${next?`<button class="next" data-nav="${current+1}"><span>Next →</span>${next.title}</button>`:''}
    </div>`;
  }
  window.scrollTo({top:0});
}

function render(){renderNav();renderMain()}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-ch],[data-toggle],[data-learn],[data-goto],[data-nav]');
  if(!el)return;
  if(el.dataset.ch!==undefined){query='';searchEl.value='';current=+el.dataset.ch;render();}
  else if(el.dataset.nav!==undefined){current=+el.dataset.nav;render();}
  else if(el.dataset.toggle){const t=byId[el.dataset.toggle];t._open=!t._open;
    const card=document.getElementById('card-'+t.id);card.classList.toggle('open',t._open);
    el.setAttribute('aria-expanded',t._open);}
  else if(el.dataset.learn){const id=el.dataset.learn;const t=byId[id];
    const set=t.isEx?done:learned;
    set.has(id)?set.delete(id):set.add(id);save();
    const card=document.getElementById('card-'+id);card.classList.toggle('learned',set.has(id));
    el.textContent=set.has(id)?(t.isEx?'Done ✓':'Collected ✓'):(t.isEx?'Mark complete':'Mark as learned');
    renderNav();}
  else if(el.dataset.goto){const t=byId[el.dataset.goto];query='';searchEl.value='';
    current=t.ci;t._open=true;render();
    document.getElementById('card-'+t.id).scrollIntoView({behavior:'smooth',block:'center'});}
});

searchEl.addEventListener('input',()=>{query=searchEl.value.trim();renderMain();renderNav();});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==searchEl){e.preventDefault();searchEl.focus();}
  if(e.key==='Escape'&&query){query='';searchEl.value='';render();}
});
document.getElementById('reset').addEventListener('click',()=>{
  if(confirm('Clear all concept and field-work progress?')){learned.clear();done.clear();save();render();}
});

render();
</script>
</body>
</html>
